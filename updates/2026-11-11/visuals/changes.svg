<svg xmlns="http://www.w3.org/2000/svg" width="960" height="416" viewBox="0 0 960 416"><rect width="960" height="416" rx="18" fill="#142e31"/><g font-family="sans-serif"><text x="30" y="48" fill="white" font-size="28">차곡 1.2 · 달라진 사용 흐름</text><g font-size="16" fill="#98e2cd"><text x="214" y="90">이전</text><text x="552" y="90">업데이트 후</text></g><path d="M28 107 H930" stroke="#426265"/><g font-size="17" fill="white"><text x="30" y="140">01  정비 완료</text><text x="214" y="140" fill="#c5d2cf">일정 완료 후 비용을 별도로 등록</text><text x="552" y="140">날짜·거리·비용 입력 후 다음 일정까지 제안</text></g><path d="M28 181 H930" stroke="#426265"/><g font-size="17" fill="white"><text x="30" y="214">02  정비 이력</text><text x="214" y="214" fill="#c5d2cf">최근 완료한 일정 10개만 표시</text><text x="552" y="214">전체 이력을 정비명으로 검색</text></g><path d="M28 255 H930" stroke="#426265"/><g font-size="17" fill="white"><text x="30" y="288">03  기록 기간</text><text x="214" y="288" fill="#c5d2cf">검색어와 항목으로만 조회</text><text x="552" y="288">이번 달·지난달·직접 선택 기간과 함께 검색</text></g><path d="M28 329 H930" stroke="#426265"/><g font-size="17" fill="white"><text x="30" y="362">04  백업 복원</text><text x="214" y="362" fill="#c5d2cf">교체 경고만 보고 복원 결정</text><text x="552" y="362">차량명·지출 건수·최근 기록일을 먼저 확인</text></g></g></svg>